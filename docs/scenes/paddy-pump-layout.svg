<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <rect width="1400" height="980" fill="#101411"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="64" fill="#e7dfca" font-size="28" letter-spacing="2">PADDY IRRIGATION PUMP STATION / 场景图</text>
    <text x="70" y="92" fill="#8d9a8e" font-size="12" letter-spacing="2">PLAN · NOT TO SCALE · UNITS: METRES</text>

    <!-- site -->
    <rect x="70" y="140" width="760" height="560" fill="#1a2a1f" stroke="#33463a" stroke-width="2"/>
    <g stroke="#5d775f" stroke-width="1" opacity="0.5">
      <path d="M70 300 H830 M70 460 H830 M70 620 H830"/>
      <path d="M250 140 V700 M430 140 V700 M610 140 V700"/>
    </g>

    <!-- paddy A and B -->
    <rect x="90" y="160" width="330" height="520" fill="#20362a" stroke="#6b8b66" stroke-width="1.5"/>
    <text x="120" y="195" fill="#a9bd9d" font-size="15">RICE PADDY A</text>
    <text x="120" y="218" fill="#70846f" font-size="10">WATER + RICE INSTANCES</text>

    <rect x="470" y="160" width="330" height="520" fill="#20362a" stroke="#6b8b66" stroke-width="1.5"/>
    <text x="500" y="195" fill="#a9bd9d" font-size="15">RICE PADDY B</text>
    <text x="500" y="218" fill="#70846f" font-size="10">WATER + RICE INSTANCES</text>

    <!-- canal -->
    <rect x="70" y="140" width="22" height="560" fill="#0e2220" stroke="#3d6f68" stroke-width="2"/>
    <text x="38" y="450" fill="#6b9b94" font-size="10" transform="rotate(-90 38 450)">IRRIGATION CANAL</text>

    <!-- bunds -->
    <rect x="420" y="140" width="50" height="560" fill="#3b3424" stroke="#5e5337" stroke-width="1"/>
    <rect x="90" y="680" width="710" height="34" fill="#3b3424" stroke="#5e5337" stroke-width="1"/>
    <text x="425" y="725" fill="#8d7c58" font-size="10">FIELD BUND</text>

    <!-- pump pad -->
    <rect x="230" y="330" width="380" height="260" fill="#4a4b42" stroke="#b4b29b" stroke-width="2"/>
    <text x="250" y="360" fill="#d8d3bd" font-size="13" letter-spacing="2">CONCRETE PUMP PAD</text>
    <text x="250" y="380" fill="#9d9b87" font-size="9">3.2 × 2.2 · TOP +0.120</text>

    <!-- skid -->
    <rect x="285" y="410" width="280" height="90" fill="#252b28" stroke="#8aa095" stroke-width="2"/>
    <text x="300" y="438" fill="#c4c9ba" font-size="10">COMMON BASEPLATE · ANCHOR BOLTS</text>

    <!-- pump -->
    <circle cx="350" cy="465" r="42" fill="none" stroke="#5aa36a" stroke-width="6"/>
    <circle cx="350" cy="465" r="12" fill="#5aa36a"/>
    <text x="300" y="530" fill="#8fd39d" font-size="11">P-02 PUMP</text>
    <text x="300" y="546" fill="#70846f" font-size="9">SHAFT Z = 0.351</text>

    <!-- motor -->
    <rect x="430" y="438" width="105" height="54" rx="20" fill="#1b2420" stroke="#b6c7ba" stroke-width="2"/>
    <text x="438" y="522" fill="#c8d2c2" font-size="11">M-01 YE3-132S-4</text>
    <text x="438" y="538" fill="#70846f" font-size="9">THREE.JS MOTOR · 132 mm SHAFT</text>

    <!-- coupling -->
    <rect x="400" y="450" width="28" height="30" fill="#bc8e2d" stroke="#e3bd65" stroke-width="1"/>
    <text x="384" y="498" fill="#d9b25a" font-size="8">COUPLING</text>

    <!-- discharge -->
    <path d="M350 423 V300 H700 V560" fill="none" stroke="#b9c8c7" stroke-width="8" stroke-linecap="square"/>
    <rect x="450" y="282" width="24" height="36" fill="#b9c8c7"/>
    <rect x="560" y="282" width="24" height="36" fill="#b9c8c7"/>
    <text x="470" y="270" fill="#b9c8c7" font-size="9">DISCHARGE · CHECK VALVE / GATE VALVE</text>
    <text x="720" y="400" fill="#70846f" font-size="9">TO FIELD OUTLET</text>

    <!-- suction -->
    <path d="M350 507 V600 H110 V560" fill="none" stroke="#5aa36a" stroke-width="7"/>
    <rect x="240" y="585" width="60" height="30" fill="#70846f"/>
    <text x="250" y="625" fill="#8fd39d" font-size="9">STRAINER</text>

    <!-- shelter -->
    <rect x="120" y="760" width="210" height="120" fill="#242d27" stroke="#56685a" stroke-width="1.5"/>
    <text x="136" y="790" fill="#a9bd9d" font-size="12">SHED / ENV-06</text>
    <text x="136" y="810" fill="#70846f" font-size="9">TIMBER + CORRUGATED ROOF</text>

    <!-- dimensions -->
    <g stroke="#d7c597" stroke-width="1" fill="none">
      <path d="M230 300 H610"/>
      <path d="M230 292 V308 M610 292 V308"/>
      <path d="M610 330 V590"/>
      <path d="M602 330 H618 M602 590 H618"/>
    </g>
    <text x="400" y="292" fill="#d7c597" font-size="10">3.2 m</text>
    <text x="625" y="470" fill="#d7c597" font-size="10">2.2 m</text>

    <!-- legend -->
    <text x="900" y="180" fill="#d7c597" font-size="13" letter-spacing="2">ASSET SOURCES</text>
    <g font-size="11">
      <rect x="900" y="205" width="14" height="14" fill="#5aa36a"/><text x="925" y="216" fill="#b7c4b4">Blender manual / generated mockup</text>
      <rect x="900" y="236" width="14" height="14" fill="#b9c8c7"/><text x="925" y="247" fill="#b7c4b4">Pipe / valve / instrument library</text>
      <rect x="900" y="267" width="14" height="14" fill="#bc8e2d"/><text x="925" y="278" fill="#b7c4b4">Standard component model</text>
      <rect x="900" y="298" width="14" height="14" fill="#20362a" stroke="#6b8b66"/><text x="925" y="309" fill="#b7c4b4">Poly Haven CC0 environment</text>
      <rect x="900" y="329" width="14" height="14" fill="#1b2420" stroke="#b6c7ba"/><text x="925" y="340" fill="#b7c4b4">Three.js Motor (not in GLB)</text>
    </g>

    <text x="900" y="400" fill="#d7c597" font-size="13" letter-spacing="2">HARD CONSTRAINTS</text>
    <g font-size="11" fill="#b7c4b4">
      <text x="900" y="426">1 unit = 1 m</text>
      <text x="900" y="448">baseplate top = 0.219 m</text>
      <text x="900" y="470">132S shaft height = 0.132 m</text>
      <text x="900" y="492">motor shaft = pump shaft = 0.351 m</text>
      <text x="900" y="514">coupling gap = 3 mm</text>
      <text x="900" y="536">IM B3 · feet on common base</text>
    </g>

    <text x="900" y="610" fill="#d7c597" font-size="13" letter-spacing="2">NEXT ASSETS</text>
    <g font-size="11" fill="#b7c4b4">
      <text x="900" y="636">concrete PBR (CC0)</text>
      <text x="900" y="658">mud / bund PBR (CC0)</text>
      <text x="900" y="680">rice + weeds (Geometry Nodes / CC0)</text>
      <text x="900" y="702">HDRI sky (CC0)</text>
      <text x="900" y="724">pump CAD / manual detail</text>
      <text x="900" y="746">flange and bolt library</text>
    </g>

    <text x="70" y="940" fill="#5f6d61" font-size="10">Scene plan only. Not a construction drawing. Reference photos are research material, not website assets.</text>
  </g>
</svg>
